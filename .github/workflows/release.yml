name: Manual release candidate

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact lowercase 40-character commit SHA already reviewed for release
        type: string
        required: true
      version:
        description: Candidate version matching pyproject.toml, for example 0.2.0
        type: string
        required: true
      project_license_attested:
        description: Rights holder established project LICENSE and cleared/omitted assets
        type: boolean
        required: true
        default: false
      dependency_distribution_attested:
        description: PyQt/Qt and all distributed dependency obligations reviewed and met
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify explicit release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Fail closed on missing attestations, grant or version mismatch
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_VERSION: ${{ inputs.version }}
          PROJECT_LICENSE_ATTESTED: ${{ inputs.project_license_attested }}
          DEPENDENCY_DISTRIBUTION_ATTESTED: ${{ inputs.dependency_distribution_attested }}
        run: python .github/scripts/release_gate.py

  checks:
    name: Recheck the exact candidate on all native platforms
    needs: gate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.commit }}
      package_gui_preview: false
      preview_distribution_attested: false

  draft:
    name: Create reviewed source-only draft prerelease
    needs: [gate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-distributions
          path: release-input
          digest-mismatch: error
      - name: Create draft and attach only source packages with checksums
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const version = process.env.RELEASE_VERSION;
            const commit = process.env.RELEASE_COMMIT;
            if (!/^\d+\.\d+\.\d+$/.test(version) || !/^[0-9a-f]{40}$/.test(commit)) {
              throw new Error('Invalid candidate identity');
            }
            const tag = `v${version}`;
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              throw new Error('A release with this tag already exists; review it instead of overwriting.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const files = fs.readdirSync('release-input').filter(name => /\.(whl|tar\.gz)$/.test(name));
            if (files.length !== 2 || !files.some(name => name.endsWith('.whl')) || !files.some(name => name.endsWith('.tar.gz'))) {
              throw new Error('Expected exactly one verified wheel and source distribution');
            }
            const checksums = files.sort().map(name => {
              const bytes = fs.readFileSync(path.join('release-input', name));
              return `${crypto.createHash('sha256').update(bytes).digest('hex')}  ${name}`;
            }).join('\n') + '\n';
            fs.writeFileSync('release-input/SHA256SUMS.txt', checksums);
            const body = [
              `Source-only candidate for exact commit ${commit}.`,
              'Linux quality/audit and native Windows/macOS reviewed-example packaging checks passed in this workflow.',
              'Source/venv installation is required for project packaging. Frozen PyForge is UI-only and is not included.',
              'No signed/notarized binary or PyPI publication is provided.',
              'Maintainer must review licensing/notices, artifact checksums and interactive native evidence before publishing this draft.',
              `Verification run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
            ].join('\n\n');
            const release = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: commit,
              name: `PyForge ${version} candidate`, body, draft: true, prerelease: true
            });
            for (const name of [...files, 'SHA256SUMS.txt']) {
              const data = fs.readFileSync(path.join('release-input', name));
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.data.id, name, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length }
              });
            }
            core.notice(`Draft only, not published: ${release.data.html_url}`);
